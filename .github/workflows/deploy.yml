name: Deploy React App via API (Hidden Zip Test)

on:
  push:
    branches: [test-with-api]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Package Build into Hidden Zip
        # Notice the dot! We name it .app.zip
        run: |
          cd dist
          zip -r ../.app.zip ./*
          cd ..

      - name: Delete Old React Assets in Test Zone
        run: |
          curl -s -u "${{ secrets.SERVER_USER }}:${{ secrets.DA_LOGIN_KEY }}" \
               -X POST \
               -d "action=multiple" \
               -d "button=delete" \
               -d "path=/domains/acompa-conf.org/public_html/ci_test_zone" \
               -d "select0=assets" \
               "https://melody.maychu.cloud:2222/CMD_API_FILE_MANAGER"

      - name: Upload Hidden Zip to Test Zone
        run: |
          curl -s -u "${{ secrets.SERVER_USER }}:${{ secrets.DA_LOGIN_KEY }}" \
               -X POST \
               -F "action=upload" \
               -F "path=/domains/acompa-conf.org/public_html/ci_test_zone" \
               -F "file1=@.app.zip" \
               "https://melody.maychu.cloud:2222/CMD_API_FILE_MANAGER"

      - name: Extract Hidden Zip
        run: |
          curl -s -u "${{ secrets.SERVER_USER }}:${{ secrets.DA_LOGIN_KEY }}" \
               -X POST \
               -d "action=extract" \
               -d "path=/domains/acompa-conf.org/public_html/ci_test_zone" \
               -d "filename=.app.zip" \
               "https://melody.maychu.cloud:2222/CMD_API_FILE_MANAGER"

      - name: Attempt Clean Up
        # We give it 5 seconds. If it deletes, great.
        # If the server locks it, it's safe and hidden anyway!
        run: |
          sleep 5
          curl -s -u "${{ secrets.SERVER_USER }}:${{ secrets.DA_LOGIN_KEY }}" \
               -X POST \
               -d "action=multiple" \
               -d "button=delete" \
               -d "path=/domains/acompa-conf.org/public_html/ci_test_zone" \
               -d "select0=.app.zip" \
               "https://melody.maychu.cloud:2222/CMD_API_FILE_MANAGER"
