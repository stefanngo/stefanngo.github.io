name: Deploy React App via API (Targeted Deletion Test)

on:
  push:
    branches: [ test-with-api ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Package Build for Targeted Test
        # Zips the contents of the dist folder, just like production
        run: |
          cd dist
          zip -r ../app.zip ./*
          cd ..

      - name: Delete Old React Assets in Test Zone
        # Targets ONLY the 'assets' folder INSIDE ci_test_zone
        run: |
          curl -s -u "${{ secrets.SERVER_USER }}:${{ secrets.DA_LOGIN_KEY }}" \
               -X POST \
               -d "action=multiple" \
               -d "button=delete" \
               -d "path=/domains/acompa-conf.org/public_html/ci_test_zone" \
               -d "select0=assets" \
               "https://melody.maychu.cloud:2222/CMD_API_FILE_MANAGER"

      - name: Upload Zip to Test Zone
        # Uploads specifically to the ci_test_zone folder
        run: |
          curl -s -u "${{ secrets.SERVER_USER }}:${{ secrets.DA_LOGIN_KEY }}" \
               -X POST \
               -F "action=upload" \
               -F "path=/domains/acompa-conf.org/public_html/ci_test_zone" \
               -F "file1=@app.zip" \
               "https://melody.maychu.cloud:2222/CMD_API_FILE_MANAGER"

      - name: Extract New Files in Test Zone
        # Overwrites index.html and creates the new assets folder
        run: |
          curl -s -u "${{ secrets.SERVER_USER }}:${{ secrets.DA_LOGIN_KEY }}" \
               -X POST \
               -d "action=extract" \
               -d "path=/domains/acompa-conf.org/public_html/ci_test_zone" \
               -d "filename=app.zip" \
               "https://melody.maychu.cloud:2222/CMD_API_FILE_MANAGER"

      - name: Clean up Zip File
        run: |
          sleep 5
          curl -s -u "${{ secrets.SERVER_USER }}:${{ secrets.DA_LOGIN_KEY }}" \
               -X POST \
               -d "action=multiple" \
               -d "button=delete" \
               -d "path=/domains/acompa-conf.org/public_html/ci_test_zone" \
               -d "select0=app.zip" \
               "https://melody.maychu.cloud:2222/CMD_API_FILE_MANAGER"
