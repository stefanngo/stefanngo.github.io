name: Deploy to Test Zone
on:
  push:
    branches: [test-deploy-setup] # <--- CHANGE 1: Only run on your test branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy via SCP
        uses: appleboy/scp-action@master
        with:
          host: "acompa-conf.org"
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/*"
          # CHANGE 2: Point to your SAFE ZONE folder
          target: "/home/acomptec/domains/acompa-conf.org/public_html/ci_test_zone"
          strip_components: 1
