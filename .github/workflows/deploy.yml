name: Deploy to Test Zone
on:
  push:
    branches: [test-deploy-setup] # <--- CHANGE 1: Only run on your test branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          server-dir: /domains/acompa-conf.org/public_html/ci_test_zone/
          local-dir: ./dist/
